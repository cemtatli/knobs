<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
    :root {
      color-scheme: light dark;
      --accent: #ef1b37;
      --bg: #f4f4f5;
      --card: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --seg: #f4f4f5;
      --seg-on: #ffffff;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 0 0 1px rgb(0 0 0 / 0.04);
      --off: #e4e4e7;
      --off-mark: #a1a1aa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --card: #1c1c1f;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --line: #2a2a2e;
        --seg: #111113;
        --seg-on: #333338;
        --shadow: 0 0 0 1px rgb(255 255 255 / 0.05);
        --off: #3a3a3f;
        --off-mark: #8e8e96;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 312px;
      padding: 16px 12px 14px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.35 "Geist", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header { display: flex; align-items: center; gap: 12px; padding: 2px 6px 6px; }
    header img { width: 44px; height: 44px; object-fit: contain; flex: none; }
    header h1 { margin: 0; font-size: 17px; font-weight: 680; letter-spacing: -0.02em; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

    .label {
      margin: 16px 6px 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; min-height: 56px; }
    .item + .item { border-top: 1px solid var(--line); margin-left: 14px; }
    .item + .item .row { padding-left: 0; }
    .item + .item .seg { margin-left: 0; }
    .text { flex: 1; min-width: 0; }
    .name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }

    /* sub-options slide open under their row while the feature is on */
    .sub { display: grid; grid-template-rows: 0fr; }
    .ready .sub { transition: grid-template-rows 0.22s ease; }
    .sub > div { overflow: hidden; }
    .sub.open { grid-template-rows: 1fr; }

    .seg {
      display: flex; gap: 2px; padding: 3px; margin: -2px 12px 12px 14px;
      background: var(--seg); border-radius: 10px;
    }
    .seg button {
      flex: 1; border: 0; border-radius: 7px; padding: 6px 0;
      background: transparent; color: var(--muted);
      font: inherit; font-size: 12px; font-weight: 550; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
    .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* Wide pill switch with a pill thumb, as in Oobo: "I" shows on the left when on,
       "O" on the right when off. Track 46x24, thumb 26x18, 3px inset. */
    .switch { position: relative; flex: none; width: 46px; height: 24px; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
    .switch span { position: absolute; inset: 0; border-radius: 24px; background: var(--off); pointer-events: none; }
    .switch span::before { /* thumb */
      content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 18px; z-index: 1;
      border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.22);
    }
    .switch span::after { /* "O" */
      content: ""; position: absolute; right: 8px; top: 8px; width: 8px; height: 8px;
      border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--off-mark);
    }
    .switch i { /* "I" */
      position: absolute; left: 11px; top: 8px; width: 2px; height: 8px;
      border-radius: 1px; background: #fff; opacity: 0;
    }
    .ready .switch span { transition: background 0.2s; }
    .ready .switch span::before { transition: transform 0.32s cubic-bezier(0.34, 1.45, 0.64, 1), width 0.2s; }
    .ready .switch span::after, .ready .switch i { transition: opacity 0.2s; }
    .switch input:active + span::before { width: 30px; } /* the thumb stretches while held */
    .switch input:checked:active + span::before { transform: translateX(10px); }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::before { transform: translateX(14px); }
    .switch input:checked + span::after { opacity: 0; }
    .switch input:checked + span i { opacity: 1; }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .item.off { opacity: 0.45; }
    .item.off .switch input { cursor: default; }

    footer { margin: 14px 6px 0; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/mascot-small.png" alt="" />
    <div>
      <h1>Knobs</h1>
      <p data-i18n="tagline"></p>
    </div>
  </header>

  <div class="label" data-i18n="sectionFeed"></div>
  <div class="card">
    <div class="item">
      <div class="row">
        <div class="text">
          <div class="name" data-i18n="thumbsName"></div>
          <div class="hint" data-i18n="thumbsHint"></div>
        </div>
        <label class="switch"><input type="checkbox" id="thumbs-enabled" data-i18n-label="thumbsName" /><span><i></i></span></label>
      </div>
      <div class="sub" id="thumbs-sub">
        <div>
          <div class="seg" id="thumbs-frame" role="group" data-i18n-label="frameGroup">
            <button data-value="1" data-i18n="frameStart"></button>
            <button data-value="2" data-i18n="frameMiddle"></button>
            <button data-value="3" data-i18n="frameEnd"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="item">
      <div class="row">
        <div class="text">
          <div class="name" data-i18n="shortsName"></div>
          <div class="hint" data-i18n="shortsHint"></div>
        </div>
        <label class="switch"><input type="checkbox" id="shorts-hidden" data-i18n-label="shortsName" /><span><i></i></span></label>
      </div>
    </div>

    <div class="item">
      <div class="row">
        <div class="text">
          <div class="name" data-i18n="watchedName"></div>
          <div class="hint" data-i18n="watchedHint"></div>
        </div>
      </div>
      <div class="seg" id="watched-mode" role="group" data-i18n-label="watchedName">
        <button data-value="off" data-i18n="watchedOff"></button>
        <button data-value="dim" data-i18n="watchedDim"></button>
        <button data-value="hide" data-i18n="watchedHide"></button>
      </div>
    </div>
  </div>

  <div class="label" data-i18n="sectionWatch"></div>
  <div class="card">
    <div class="item" id="minimal-item">
      <div class="row">
        <div class="text">
          <div class="name" data-i18n="minimalName"></div>
          <div class="hint" id="minimal-hint" data-i18n="minimalHint"></div>
        </div>
        <label class="switch"><input type="checkbox" id="minimal" data-i18n-label="minimalName" /><span><i></i></span></label>
      </div>
    </div>
  </div>

  <footer>
    <span data-i18n="footerLocal"></span>
    <span id="version"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
